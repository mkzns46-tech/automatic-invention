<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARICO PORTAL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section id="loginView" class="card">
      <div class="brand">ARICO TOKYO</div>
      <h1 data-ja="業務システムログイン" data-ko="업무 시스템 로그인">業務システムログイン</h1>
      <p data-ja="利用するシステムへ入るための入口です。" data-ko="이용할 시스템에 들어가기 위한 입구입니다。">利用するシステムへ入るための入口です。</p>

      <div class="lang-row">
        <button type="button" class="lang-btn" onclick="setLang('ja')">日本語</button>
        <button type="button" class="lang-btn" onclick="setLang('ko')">한국어</button>
      </div>

      <label data-ja="ユーザーID" data-ko="사용자 ID">ユーザーID</label>
      <input type="text" id="id" autocomplete="username">

      <label data-ja="パスワード" data-ko="비밀번호">パスワード</label>
      <input type="password" id="pass" autocomplete="current-password">

      <button type="button" class="primary" onclick="login()" data-ja="ログイン" data-ko="로그인">ログイン</button>
      <div id="error" class="error"></div>
    </section>

    <section id="portalView" class="card portal-card hidden">
      <div class="portal-head">
        <div>
          <div class="brand">ARICO TOKYO</div>
          <h1 data-ja="システム入口" data-ko="시스템 입구">システム入口</h1>
        </div>
        <div class="head-actions">
          <div class="lang-row small">
            <button type="button" class="lang-btn" onclick="setLang('ja')">日本語</button>
            <button type="button" class="lang-btn" onclick="setLang('ko')">한국어</button>
          </div>
          <button type="button" class="logout" onclick="logout()" data-ja="ログアウト" data-ko="로그아웃">ログアウト</button>
        </div>
      </div>

      <div class="system-grid">
        <button type="button" class="system-card" onclick="goHistorySheet()">
          <strong data-ja="在庫変動確認シート" data-ko="재고 변동 확인 시트">在庫変動確認シート</strong>
          <span data-ja="入荷・出荷・在庫修正、商品履歴を管理" data-ko="입고・출고・재고 수정、상품 이력을 관리">入荷・出荷・在庫修正、商品履歴を管理</span>
        </button>

        <button type="button" class="system-card is-disabled" onclick="comingSoon('レンタルリム管理')">
          <strong data-ja="レンタルリム管理" data-ko="렌탈 림 관리">レンタルリム管理</strong>
          <span data-ja="作成中" data-ko="작성 중">作成中</span>
        </button>

        <button type="button" class="system-card is-disabled" onclick="comingSoon('出荷前検品')">
          <strong data-ja="出荷前検品" data-ko="출하 전 검품">出荷前検品</strong>
          <span data-ja="作成中" data-ko="작성 중">作成中</span>
        </button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
