<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>バーコード在庫管理</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>バーコード在庫管理</h1>
        <p>スマホでスキャン、PCで在庫・履歴確認</p>
      </div>
      <button id="reloadBtn">再読み込み</button>
    </header>

    <section class="setup card">
      <h2>初期設定</h2>
      <p>SupabaseのURLとanon keyを入れて保存してください。</p>
      <label>SUPABASE URL</label>
      <input id="supabaseUrl" placeholder="https://xxxx.supabase.co" />
      <label>SUPABASE ANON KEY</label>
      <input id="supabaseKey" placeholder="eyJ..." />
      <button id="saveConfigBtn">設定を保存</button>
      <small>設定値はこの端末のブラウザに保存されます。</small>
    </section>

    <main class="grid">
      <section class="card scanner">
        <h2>スキャン登録</h2>
        <div class="row">
          <label>区分
            <select id="type">
              <option value="入荷">入荷</option>
              <option value="出荷">出荷</option>
              <option value="在庫修正">在庫修正</option>
            </select>
          </label>
          <label>担当者
            <input id="staff" placeholder="例：田中" />
          </label>
          <label>数量
            <input id="qty" type="number" value="1" step="1" />
          </label>
        </div>

        <label>備考（自由入力・連続スキャン中は保持）
          <input id="memo" placeholder="例：棚卸差異、サンプル使用、不良返品など" />
        </label>

        <div class="button-row">
          <button id="startCameraBtn">カメラ読取開始</button>
          <button id="stopCameraBtn" class="secondary">停止</button>
        </div>

        <video id="video" muted playsinline></video>

        <form id="manualForm">
          <label>手入力・外付けスキャナ入力
            <input id="barcodeInput" autocomplete="off" placeholder="バーコードを入力またはスキャンしてEnter" />
          </label>
          <button type="submit">登録</button>
        </form>

        <div id="message" class="message">初期設定後、スキャンできます。</div>
      </section>

      <section class="card">
        <h2>商品登録</h2>
        <form id="productForm">
          <label>バーコード<input id="productBarcode" required /></label>
          <label>商品名<input id="productName" required /></label>
          <label>原在庫<input id="baseStock" type="number" value="0" step="1" /></label>
          <label>棚番<input id="location" placeholder="例：A-01" /></label>
          <button type="submit">商品を登録・更新</button>
        </form>
      </section>

      <section class="card wide">
        <h2>在庫確認</h2>
        <input id="searchInput" placeholder="バーコード・商品名・棚番で検索" />
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>バーコード</th><th>商品名</th><th>棚番</th><th>原在庫</th>
                <th>入荷</th><th>出荷</th><th>修正</th><th>実在庫</th>
              </tr>
            </thead>
            <tbody id="stockBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card wide">
        <h2>履歴</h2>
        <div class="button-row">
          <button id="csvBtn" class="secondary">CSV出力</button>
          <button id="clearFilterBtn" class="secondary">検索クリア</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日時</th><th>区分</th><th>担当者</th><th>バーコード</th>
                <th>商品名</th><th>数量</th><th>備考</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
