<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARICO ARCHERY 販売管理 設定</title>
<link rel="stylesheet" href="sales-style.css?v=20260613-5">
<script src="sales-auth.js"></script>
<script>requireSalesAuth();</script>
<script src="sales-storage.js"></script>
<script src="sales-nav.js?v=20260613-vtest" defer></script>
<script src="settings.js" defer></script>
<script src="sales-smaregi.js" defer></script>
</head>
<body>
<main class="sales-wrap">
  <header class="sales-header">
    <div>
      <div class="brand">ARICO ARCHERY</div>
      <h1>設定</h1>
      <p class="lead">販売管理で使用する商品マスターを管理します。</p>
    </div>
    <div class="sales-actions">
      <a class="pill" href="index.html">販売管理トップ</a>
      <button type="button" class="secondary" onclick="logoutSales();">ログイン画面に戻る</button>
    </div>
  </header>

  <div id="salesMessage" class="message">新スマレジの商品マスターを販売管理の商品検索へ反映できます。</div>

  <section class="card sales-smaregi-card">
    <div class="section-title">
      <div>
        <h2>スマレジ商品マスター取込</h2>
        <p class="section-note">新スマレジから商品名・バーコード・スマレジ商品ID・販売価格を取得します。価格取得に失敗しても商品マスター取込は継続します。</p>
      </div>
      <div class="badge muted">新スマレジ</div>
    </div>
    <div class="settings-import-panel">
      <button type="button" id="salesSmaregiImportBtn" class="primary" onclick="importSalesSmaregiProducts();">スマレジ商品マスター取込</button>
    </div>
  </section>
</main>
<div id="salesPopup" class="app-popup" style="display:none;">
  <div class="app-popup-card">
    <div id="salesPopupTitle" class="app-popup-title">完了</div>
    <div id="salesPopupBody" class="app-popup-body"></div>
    <button type="button" id="salesPopupClose">OK</button>
  </div>
</div>
</body>
</html>
