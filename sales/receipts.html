<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARICO ARCHERY 領収書</title>
<link rel="stylesheet" href="sales-style.css?v=20260614-lists-hidden">
<script src="sales-auth.js"></script>
<script>requireSalesAuth();</script>
<script src="sales-nav.js?v=20260614-lists-hidden" defer></script>
<script src="receipt-pdf.js?v=20260614-lists-hidden"></script>
<script src="receipts.js?v=20260614-lists-hidden" defer></script>
</head>
<body>
<main class="sales-wrap">
  <header class="sales-header">
    <div>
      <div class="brand">ARICO ARCHERY</div>
      <h1>領収書</h1>
      <p class="lead">入金済み請求書から領収書を作成し、PDF出力します。在庫とスマレジ売上は変更しません。</p>
    </div>
    <div class="sales-actions">
      <a class="pill" href="payments.html">入金確認</a>
      <button type="button" class="secondary" onclick="logoutSales();">ログイン画面に戻る</button>
    </div>
  </header>

  <div id="salesMessage" class="message">入金済み請求書から領収書を作成できます。</div>

  <section class="card collapsible-list-card">
    <div class="sales-actions section-heading-row">
      <h2 class="list-heading" onclick="toggleIssuedReceiptList();">▶ 領収書一覧 <span class="status-badge muted" id="receiptTargetCount">0件</span></h2>
      <button type="button" class="secondary list-toggle-button" id="receiptIssuedToggle" onclick="toggleIssuedReceiptList();">一覧を開く</button>
    </div>
    <div class="list-panel" id="receiptListPanel" hidden>
      <div class="list-filter-row">
        <label>一覧検索<input id="receiptSearch" placeholder="顧客名・件名・請求書番号・領収書番号・ステータス"></label>
        <label>ステータス
          <select id="receiptStatusFilter">
            <option value="">全て</option>
            <option value="未発行">未発行</option>
            <option value="発行済み">発行済み</option>
            <option value="キャンセル">キャンセル</option>
          </select>
        </label>
        <label>開始日<input id="receiptDateFromFilter" type="date"></label>
        <label>終了日<input id="receiptDateToFilter" type="date"></label>
      </div>
      <div class="list-subheading">未発行の領収書 / 入金済み請求書</div>
      <div class="table-wrap list-scroll">
        <table>
          <thead><tr><th>&#30058;&#21495;</th><th>&#30330;&#34892;&#26085;</th><th>&#22243;&#20307;&#21517;</th><th>&#39015;&#23458;&#21517;</th><th>&#21512;&#35336;&#37329;&#38989;</th><th>&#12473;&#12486;&#12540;&#12479;&#12473;</th><th>&#25285;&#24403;&#32773;</th><th>&#25805;&#20316;</th></tr></thead>
          <tbody id="receiptTargetListBody"></tbody>
        </table>
      </div>
      <div class="list-panel completed-list-panel" id="issuedReceiptListPanel" hidden>
        <div class="list-subheading">発行済み・キャンセル済み</div>
        <div class="table-wrap list-scroll">
          <table>
            <thead><tr><th>&#30058;&#21495;</th><th>&#30330;&#34892;&#26085;</th><th>&#22243;&#20307;&#21517;</th><th>&#39015;&#23458;&#21517;</th><th>&#21512;&#35336;&#37329;&#38989;</th><th>&#12473;&#12486;&#12540;&#12479;&#12473;</th><th>&#25285;&#24403;&#32773;</th><th>&#25805;&#20316;</th></tr></thead>
            <tbody id="issuedReceiptListBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <section class="card" id="receiptDetailCard">
    <h2>&#38936;&#21454;&#26360;&#35443;&#32048;</h2>
    <div class="row three">
      <label>&#38936;&#21454;&#26360;&#30058;&#21495;<input id="receiptNo" readonly></label>
      <label>&#35531;&#27714;&#26360;&#30058;&#21495;<input id="sourceInvoiceNo" readonly></label>
      <label>&#12473;&#12486;&#12540;&#12479;&#12473;<input id="receiptStatus" readonly></label>
    </div>
    <div class="row three">
      <label>&#39015;&#23458;&#21517;<input id="receiptCustomerName"></label>
      <label>&#20214;&#21517;<input id="receiptSubject"></label>
      <label>&#25285;&#24403;&#32773;<input id="receiptStaff" readonly></label>
    </div>
    <div class="row three">
      <label>&#20837;&#37329;&#26085;<input id="receiptPaymentDate" type="date"></label>
      <label>&#20837;&#37329;&#38989;<input id="receiptAmount" readonly></label>
      <label>&#20837;&#37329;&#26041;&#27861;<input id="receiptMethod" readonly></label>
    </div>
    <div class="row two">
      <label>&#20633;&#32771;<textarea id="receiptMemo" readonly></textarea></label>
    </div>
    <div class="sales-actions" style="margin-top:14px">
      <button type="button" onclick="saveCurrentReceipt();">&#20445;&#23384;</button>
      <button type="button" class="secondary" onclick="outputCurrentReceiptPdf();">PDF&#20986;&#21147;</button>
    </div>
  </section>
</main>
<div id="salesPopup" class="app-popup" style="display:none;">
  <div class="app-popup-card">
    <div id="salesPopupTitle" class="app-popup-title">完了</div>
    <div id="salesPopupBody" class="app-popup-body"></div>
    <button type="button" id="salesPopupClose">OK</button>
  </div>
</div>
</body>
</html>
