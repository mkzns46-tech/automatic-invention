<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARICO ARCHERY 販売管理</title>
<link rel="stylesheet" href="sales-style.css?v=20260616-home-action-list">
<script src="sales-auth.js"></script>
<script>requireSalesAuth();</script>
<script src="sales-nav.js?v=20260614-progress" defer></script>
<script src="staff-display.js?v=20260616-staff-display-map" defer></script>
<script src="sales-pdf-format.js?v=20260615-unified-pdf" defer></script>
<script src="sales-home-progress.js?v=20260616-home-action-list" defer></script>
</head>
<body>
<main class="sales-wrap">
  <header class="sales-header">
    <div>
      <div class="brand">ARICO ARCHERY</div>
      <h1>販売管理</h1>
      <p class="lead">見積、請求、入金確認、納品などの販売業務を確認します。</p>
    </div>
    <div class="sales-actions">
      <a class="pill" href="../portal/portal.html">システム入口に戻る</a>
      <button type="button" class="secondary" onclick="logoutSales();">ログアウト</button>
    </div>
  </header>

  <div id="salesMessage" class="message">販売管理トップです。左メニューから各機能へ移動できます。</div>

  <section class="card sales-home-action-card">
    <div class="section-title">
      <div>
        <h2>対応一覧 <span class="status-badge muted" id="homeActionCount">0件 / 合計 0円</span></h2>
        <p class="section-note">今やるべき見積・請求・入金・納品だけを表示します。</p>
      </div>
      <label class="sales-completed-toggle">
        <input type="checkbox" id="homeShowCompletedActions">
        完了案件を表示
      </label>
    </div>

    <div class="table-wrap sales-home-action-scroll">
      <table class="sales-home-action-table">
        <thead>
          <tr>
            <th>種別</th>
            <th>伝票番号</th>
            <th>顧客名</th>
            <th>日付</th>
            <th>金額</th>
            <th>担当者</th>
            <th>状態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="homeActionBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card sales-home-ticket-card">
    <div class="section-title">
      <div>
        <h2>伝票一覧 <span class="status-badge muted" id="homeTicketCount">0件 / 合計 0円</span></h2>
        <p class="section-note">直近50件を表示します。検索時は条件に一致した伝票へ切り替わります。</p>
      </div>
      <a class="secondary" href="progress.html">販売進捗確認を開く</a>
    </div>

    <div class="progress-list-filter sales-home-ticket-filter">
      <label>ステータス<select id="homeTicketStatusFilter"></select></label>
      <label>取引区分<select id="homeTicketTransactionFilter"></select></label>
      <label>団体名<input id="homeTicketOrganizationFilter" placeholder="団体名"></label>
      <label>顧客名<input id="homeTicketCustomerFilter" placeholder="顧客名"></label>
      <label>開始日<input id="homeTicketDateFromFilter" type="date"></label>
      <label>終了日<input id="homeTicketDateToFilter" type="date"></label>
    </div>

    <div class="table-wrap sales-home-ticket-scroll">
      <table class="sales-home-ticket-table">
        <thead>
          <tr>
            <th>伝票番号</th>
            <th>ステータス</th>
            <th>取引区分</th>
            <th>団体名</th>
            <th>顧客名</th>
            <th>金額</th>
            <th>日付</th>
            <th>発送日</th>
            <th>配送会社</th>
            <th>送り状番号</th>
          </tr>
        </thead>
        <tbody id="homeTicketBody"></tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
