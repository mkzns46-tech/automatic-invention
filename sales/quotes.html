<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARICO ARCHERY 見積書</title>
<link rel="stylesheet" href="sales-style.css?v=20260614-list-customer-debug">
<script src="sales-auth.js"></script>
<script>requireSalesAuth();</script>
<script src="sales-nav.js?v=20260614-lists-hidden" defer></script>
<script src="customers-storage.js?v=20260614-customer-link"></script>
<script src="customers.js?v=20260614-customer-link"></script>
<script src="sales-calculator.js"></script>
<script src="quote-pdf.js?v=20260614-lists-hidden"></script>
<script src="quotes.js?v=20260614-list-customer-debug" defer></script>
</head>
<body>
<main class="sales-wrap">
  <header class="sales-header">
    <div>
      <div class="brand">ARICO ARCHERY</div>
      <h1>見積書</h1>
      <p class="lead">見積作成・一覧・PDF出力を行います。在庫とスマレジ在庫は変更しません。</p>
    </div>
    <div class="sales-actions">
      <a class="pill" href="index.html">販売管理トップ</a>
      <button type="button" class="secondary" onclick="logoutSales();">ログイン画面に戻る</button>
    </div>
  </header>

  <div id="salesMessage" class="message">見積書を作成できます。</div>

  <section class="card collapsible-list-card" id="quoteListCard">
    <div class="sales-actions section-heading-row">
      <h2 class="list-heading" onclick="toggleQuoteList();">見積書一覧 <span class="status-badge muted" id="quoteListCount">0件</span></h2>
      <button type="button" class="secondary list-toggle-button" id="quoteListToggle" onclick="toggleQuoteList();">一覧を閉じる</button>
      <button type="button" class="primary" onclick="newQuote(true);">新規見積</button>
    </div>
    <div class="list-panel" id="quoteListPanel">
      <div class="list-filter-row">
        <label>一覧検索<input id="quoteListSearch" placeholder="顧客名・担当者・件名・見積番号・ステータス"></label>
        <label>ステータス
          <select id="quoteStatusFilter">
            <option value="">全て</option>
            <option value="下書き">下書き</option>
            <option value="請求書変換済み">請求書変換済み</option>
            <option value="キャンセル">キャンセル</option>
          </select>
        </label>
        <label>開始日<input id="quoteDateFromFilter" type="date"></label>
        <label>終了日<input id="quoteDateToFilter" type="date"></label>
      </div>
      <div class="list-subheading">対応が必要な見積書</div>
      <div class="table-wrap list-scroll">
      <table>
        <thead><tr><th>&#30058;&#21495;</th><th>&#20316;&#25104;&#26085;</th><th>&#22243;&#20307;&#21517;</th><th>&#39015;&#23458;&#21517;</th><th>&#21512;&#35336;&#37329;&#38989;</th><th>&#12473;&#12486;&#12540;&#12479;&#12473;</th><th>&#25285;&#24403;&#32773;</th><th>&#25805;&#20316;</th></tr></thead>
        <tbody id="quoteListBody"></tbody>
      </table>
      </div>
      <div class="list-panel completed-list-panel" id="quoteCompletedListPanel" hidden>
        <div class="list-subheading">完了済み・キャンセル済み</div>
        <div class="table-wrap list-scroll">
          <table>
            <thead><tr><th>&#30058;&#21495;</th><th>&#20316;&#25104;&#26085;</th><th>&#22243;&#20307;&#21517;</th><th>&#39015;&#23458;&#21517;</th><th>&#21512;&#35336;&#37329;&#38989;</th><th>&#12473;&#12486;&#12540;&#12479;&#12473;</th><th>&#25285;&#24403;&#32773;</th><th>&#25805;&#20316;</th></tr></thead>
            <tbody id="quoteCompletedListBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <section class="card" id="quoteEditorCard">
    <h2>顧客情報</h2>
    <input id="salesCustomerId" type="hidden">
    <input id="salesCustomerCode" type="hidden">
    <input id="salesSmaregiCustomerId" type="hidden">
    <input id="salesSmaregiCustomerCode" type="hidden">
    <div class="customer-search-box">
      <label>&#39015;&#23458;&#26908;&#32034;<input id="quoteCustomerSearchInput" placeholder="&#39015;&#23458;&#21517;&#12539;&#38651;&#35441;&#30058;&#21495;&#12539;&#12513;&#12540;&#12523;&#12539;&#12473;&#12510;&#12524;&#12472;&#20250;&#21729;&#12467;&#12540;&#12489;"></label>
      <div id="quoteCustomerSearchResults" class="customer-search-results"></div>
    </div>
    <p class="section-note customer-readonly-note">&#39015;&#23458;&#24773;&#22577;&#12399;&#39015;&#23458;&#31649;&#29702;&#12363;&#12425;&#36984;&#25246;&#12375;&#12390;&#12367;&#12384;&#12373;&#12356;</p>
    <div class="row three">
      <label>&#39015;&#23458;&#21517;<input class="customer-readonly-input" id="customerName" readonly></label>
      <label>&#22243;&#20307;&#21517;<input id="quoteOrganizationName" readonly></label>
      <label>&#39015;&#23458;&#21306;&#20998;<select id="customerType"></select></label>
      <label>&#25285;&#24403;&#32773;<select id="quoteStaff"></select></label>
    </div>
    <div class="row three">
      <label>&#20303;&#25152;<input class="customer-readonly-input" id="customerAddress" readonly></label>
      <label>&#38651;&#35441;&#30058;&#21495;<input class="customer-readonly-input" id="customerPhone" readonly></label>
      <label>&#12513;&#12540;&#12523;&#12450;&#12489;&#12524;&#12473;<input class="customer-readonly-input" id="customerEmail" readonly></label>
    </div>
    <div class="row three">
      <label>&#20214;&#21517;<input id="quoteSubject"></label>
      <label>&#35211;&#31309;&#26085;<input id="quoteDate" type="date"></label>
      <label>&#26377;&#21177;&#26399;&#38480;<input id="validUntil" type="date"></label>
    </div>
    <div class="row two">
      <label>値引きテンプレート
        <select id="discountTemplate" onchange="applyDiscountTemplate();">
          <option value="none">なし</option>
          <option value="dealer10">代理店10%</option>
          <option value="all10">全品10%</option>
          <option value="custom">カスタム</option>
        </select>
      </label>
      <label>備考<textarea id="quoteMemo"></textarea></label>
    </div>
  </section>

  <section class="card">
    <h2>見積商品</h2>
    <div class="product-search-row">
      <label>商品検索<input id="productSearchInput" placeholder="商品名・バーコード・商品コード"></label>
    </div>
    <div id="productSearchResults"></div>
    <div id="quoteLines" class="quote-lines"></div>
    <div class="summary">
      <div>小計 <strong id="subtotalText">0円</strong></div>
      <div>値引き <strong id="discountText">0円</strong></div>
      <div>合計 <strong id="totalText">0円</strong></div>
      <div>内消費税 <strong id="taxText">0円</strong></div>
    </div>
    <div class="sales-actions" style="margin-top:14px">
      <button type="button" class="primary" onclick="saveQuote();">保存</button>
      <button type="button" class="secondary" onclick="outputCurrentQuotePdf();">PDF出力</button>
      <button type="button" class="danger" id="deleteQuoteBtn" onclick="deleteCurrentQuote();" hidden>見積削除</button>
    </div>
  </section>
</main>
<div id="quoteCustomerCreateModal" class="app-popup" style="display:none;">
  <div class="app-popup-card customer-create-modal-card">
    <div class="app-popup-title">&#26032;&#35215;&#39015;&#23458;&#30331;&#37682;</div>
    <div class="row two">
      <label>&#39015;&#23458;&#21517;<input id="quoteNewCustomerName"></label>
      <label>&#39015;&#23458;&#21306;&#20998;<select id="quoteNewCustomerType"></select></label>
    </div>
    <div class="row two">
      <label>&#25285;&#24403;&#32773;<input id="quoteNewCustomerStaff"></label>
      <label>&#37109;&#20415;&#30058;&#21495;<input id="quoteNewCustomerPostalCode"></label>
    </div>
    <label>&#20303;&#25152;<input id="quoteNewCustomerAddress"></label>
    <div class="row two">
      <label>&#38651;&#35441;&#30058;&#21495;<input id="quoteNewCustomerPhone"></label>
      <label>&#12513;&#12540;&#12523;&#12450;&#12489;&#12524;&#12473;<input id="quoteNewCustomerEmail" type="email"></label>
    </div>
    <label>&#20633;&#32771;<textarea id="quoteNewCustomerMemo"></textarea></label>
    <div class="sales-actions">
      <button type="button" onclick="saveQuoteNewCustomer();">&#20445;&#23384;&#12375;&#12390;&#36984;&#25246;</button>
      <button type="button" class="secondary" onclick="closeQuoteNewCustomerModal();">&#12461;&#12515;&#12531;&#12475;&#12523;</button>
    </div>
  </div>
</div>
<div id="salesPopup" class="app-popup" style="display:none;">
  <div class="app-popup-card">
    <div id="salesPopupTitle" class="app-popup-title">完了</div>
    <div id="salesPopupBody" class="app-popup-body"></div>
    <button type="button" id="salesPopupClose">OK</button>
  </div>
</div>
</body>
</html>
