<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARICO ARCHERY 見積書</title>
<link rel="stylesheet" href="sales-style.css?v=20260615-pdf-button-ui">
<script src="sales-auth.js"></script>
<script>requireSalesAuth();</script>
<script src="sales-nav.js?v=20260614-progress" defer></script>
<script src="staff-display.js?v=20260616-staff-display-map"></script>
<script src="sales-storage.js?v=20260616-supabase-sales"></script>
<script src="sales-calculator.js"></script>
<script src="sales-pdf-format.js?v=20260615-unified-pdf"></script>
<script src="customers-storage.js?v=20260614-html-repair"></script>
<script src="quotes.js?v=20260614-progress-sort" defer></script>
</head>
<body>
<main class="sales-wrap">
  <header class="sales-header">
    <div>
      <div class="brand">ARICO ARCHERY</div>
      <h1>見積書</h1>
      <p class="lead">見積作成・一覧・PDF出力を行います。在庫とスマレジ売上は変更しません。</p>
    </div>
    <div class="sales-actions">
      <a class="pill" href="index.html">販売管理トップ</a>
      <button type="button" class="secondary" onclick="logoutSales();">ログイン画面に戻る</button>
    </div>
  </header>

  <div id="salesMessage" class="message">見積書を作成できます。</div>

  <section class="card collapsible-list-card" id="quoteListCard">
    <div class="sales-actions section-heading-row">
      <h2 class="list-heading" onclick="toggleQuoteList();">見積書一覧 <span class="status-badge muted" id="quoteListCount">0件</span></h2>
      <div class="list-header-actions">
        <label class="sales-completed-toggle"><input type="checkbox" id="quoteShowCompleted">完了案件を表示</label>
        <button type="button" class="primary pdf-bulk-button" onclick="printSelectedQuotes();">PDF一括印刷</button>
        <button type="button" class="secondary list-toggle-button" id="quoteListToggle" onclick="toggleQuoteList();">一覧を閉じる</button>
      </div>
    </div>
    <div class="list-panel" id="quoteListPanel">
      <div class="list-filter-row">
        <label>一覧検索<input id="quoteListSearch" placeholder="顧客名・担当者・件名・見積番号・ステータス"></label>
        <label>ステータス
          <select id="quoteListStatusFilter">
            <option value="">全て</option>
            <option value="下書き">下書き</option>
            <option value="請求書変換済み">請求書変換済み</option>
            <option value="キャンセル">キャンセル</option>
          </select>
        </label>
        <label>開始日<input id="quoteDateFromFilter" type="date"></label>
        <label>終了日<input id="quoteDateToFilter" type="date"></label>
      </div>
      <div class="list-subheading">対応が必要な見積書</div>
      <div class="table-wrap list-scroll">
        <table>
          <thead><tr><th><input type="checkbox" class="pdf-select-checkbox" onchange="SalesPdfFormat.toggleVisiblePdfChecks('quote-pdf-check', this.checked, this)"></th><th>伝票番号</th><th>日付</th><th>団体名</th><th>顧客名</th><th>合計金額</th><th>ステータス</th><th>担当者</th><th>操作</th></tr></thead>
          <tbody id="quoteListBody"></tbody>
        </table>
      </div>
      <div class="list-panel completed-list-panel" id="quoteCompletedListPanel" hidden>
        <div class="list-subheading">完了済み・キャンセル済み</div>
        <div class="table-wrap list-scroll">
          <table>
            <thead><tr><th><input type="checkbox" class="pdf-select-checkbox" onchange="SalesPdfFormat.toggleVisiblePdfChecks('quote-pdf-check', this.checked, this)"></th><th>伝票番号</th><th>日付</th><th>団体名</th><th>顧客名</th><th>合計金額</th><th>ステータス</th><th>担当者</th><th>操作</th></tr></thead>
            <tbody id="quoteCompletedListBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <section class="card" id="quoteEditorCard">
    <div class="sales-actions section-heading-row">
      <h2>顧客情報</h2>
      <button type="button" class="secondary" onclick="newQuote(true);">入力をクリア</button>
    </div>
    <input id="salesCustomerId" type="hidden">
    <input id="salesCustomerCode" type="hidden">
    <input id="salesSmaregiCustomerId" type="hidden">
    <input id="salesSmaregiCustomerCode" type="hidden">
    <div class="customer-search-box">
      <label>顧客検索<input id="quoteCustomerSearchInput" placeholder="顧客名・電話番号・メール・スマレジ会員コード"></label>
      <div id="quoteCustomerSearchResults" class="customer-search-results"></div>
    </div>
    <p class="section-note customer-readonly-note">顧客情報は顧客管理から選択してください</p>
    <div class="row three">
      <label>顧客名<input class="customer-readonly-input" id="customerName" readonly></label>
      <label>団体名<input class="customer-readonly-input" id="quoteOrganizationName" readonly></label>
      <label>顧客区分<select id="customerType"></select></label>
      <label>担当者<select id="quoteStaff"></select></label>
    </div>
    <div class="row three">
      <label>住所<input class="customer-readonly-input" id="customerAddress" readonly></label>
      <label>電話番号<input class="customer-readonly-input" id="customerPhone" readonly></label>
      <label>メールアドレス<input class="customer-readonly-input" id="customerEmail" readonly></label>
    </div>
    <div class="row three">
      <label>件名<input id="quoteSubject"></label>
      <label>見積日<input id="quoteDate" type="date"></label>
      <label>有効期限<input id="validUntil" type="date"></label>
    </div>
    <div class="row three">
      <label>取引区分
        <select id="transactionType">
          <option value="通常販売">通常販売</option>
          <option value="交換">交換</option>
          <option value="返金">返金</option>
          <option value="無償提供">無償提供</option>
          <option value="その他">その他</option>
        </select>
      </label>
      <label>元伝票番号<input id="originalSlipNumber" placeholder="交換・返金時に入力"></label>
      <label>理由メモ<input id="reasonMemo" placeholder="交換理由・返金理由など"></label>
    </div>
    <div class="row two">
      <label>値引きテンプレート
        <select id="discountTemplate" onchange="applyDiscountTemplate();">
          <option value="none">なし</option>
          <option value="dealer10">代理店10%</option>
          <option value="all10">全品10%</option>
          <option value="custom">カスタム</option>
        </select>
      </label>
    </div>
  </section>

  <section class="card">
    <h2>見積商品</h2>
    <div class="product-search-row">
      <label>商品検索<input id="productSearchInput" placeholder="商品名・バーコード・商品コード"></label>
      <button type="button" class="secondary" onclick="addManualProductLine();">手入力商品を追加</button>
    </div>
    <div id="productSearchResults"></div>
    <div id="quoteLines" class="quote-lines"></div>
    <div class="row two">
      <label>全体値引き額<input id="overallDiscountAmount" type="number" min="0" step="1" value="0" onchange="recalcTotals();"></label>
      <label>伝票備考<textarea id="quoteMemo"></textarea></label>
    </div>
    <div class="summary">
      <div>小計<strong id="subtotalText">0円</strong></div>
      <div>値引き <strong id="discountText">0円</strong></div>
      <div>合計<strong id="totalText">0円</strong></div>
      <div>内消費税<strong id="taxText">0円</strong></div>
    </div>
    <div class="sales-actions" style="margin-top:14px">
      <button type="button" class="primary" onclick="saveQuote();">保存</button>
      <button type="button" class="secondary" onclick="outputCurrentQuotePdf();">PDF出力</button>
      <button type="button" class="danger" id="deleteQuoteBtn" onclick="deleteCurrentQuote();" hidden>見積削除</button>
    </div>
  </section>
</main>

<div id="quoteCustomerCreateModal" class="app-popup" style="display:none;">
  <div class="app-popup-card customer-create-modal-card">
    <div class="app-popup-title">新規顧客登録</div>
    <div class="row two">
      <label>顧客名<input id="quoteNewCustomerName"></label>
      <label>顧客区分<select id="quoteNewCustomerType"></select></label>
    </div>
    <div class="row two">
      <label>担当者<input id="quoteNewCustomerStaff"></label>
      <label>郵便番号<input id="quoteNewCustomerPostalCode"></label>
    </div>
    <label>住所<input id="quoteNewCustomerAddress"></label>
    <div class="row two">
      <label>電話番号<input id="quoteNewCustomerPhone"></label>
      <label>メールアドレス<input id="quoteNewCustomerEmail" type="email"></label>
    </div>
    <label>備考<textarea id="quoteNewCustomerMemo"></textarea></label>
    <div class="sales-actions">
      <button type="button" onclick="saveQuoteNewCustomer();">保存して選択</button>
      <button type="button" class="secondary" onclick="closeQuoteNewCustomerModal();">キャンセル</button>
    </div>
  </div>
</div>

<div id="salesPopup" class="app-popup" style="display:none;">
  <div class="app-popup-card">
    <div id="salesPopupTitle" class="app-popup-title">完了</div>
    <div id="salesPopupBody" class="app-popup-body"></div>
    <button type="button" id="salesPopupClose">OK</button>
  </div>
</div>
</body>
</html>
