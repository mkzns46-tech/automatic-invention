<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARICO ARCHERY 販売進捗確認</title>
<link rel="stylesheet" href="sales-style.css?v=20260614-progress-unpaid">
<script src="sales-auth.js"></script>
<script>requireSalesAuth();</script>
<script src="sales-nav.js?v=20260614-progress" defer></script>
<script src="progress.js?v=20260614-progress-unpaid" defer></script>
</head>
<body>
<main class="sales-wrap">
  <header class="sales-header">
    <div>
      <div class="brand">ARICO ARCHERY</div>
      <h1>販売進捗確認</h1>
      <p class="lead">見積から領収までの進捗を伝票番号単位で確認します。</p>
    </div>
    <div class="sales-actions">
      <a class="pill" href="index.html">トップ</a>
      <button type="button" class="secondary" onclick="logoutSales();">ログイン画面に戻る</button>
    </div>
  </header>

  <div id="salesMessage" class="message">販売進捗を確認できます。</div>

  <section class="card">
    <div class="section-title">
      <div>
        <h2>進捗一覧</h2>
        <p class="section-note">未完了を上に表示します。各ボタンから該当画面へ移動できます。</p>
      </div>
      <span class="badge muted" id="progressCount">0件</span>
    </div>

    <div class="list-filter-row progress-filter-row">
      <label>検索
        <input id="progressSearch" placeholder="伝票番号・団体名・顧客名・担当者・取引区分・ステータス">
      </label>
      <label>進捗
        <select id="progressCompletionFilter">
          <option value="incomplete">未完了のみ</option>
          <option value="complete">完了済み</option>
          <option value="all">キャンセル含む全て</option>
        </select>
      </label>
      <label>取引区分
        <select id="progressTransactionFilter">
          <option value="">全て</option>
          <option value="通常販売">通常販売</option>
          <option value="交換">交換</option>
          <option value="返金">返金</option>
          <option value="無償提供">無償提供</option>
          <option value="その他">その他</option>
        </select>
      </label>
    </div>

    <div class="table-wrap list-scroll progress-scroll">
      <table class="progress-table">
        <thead>
          <tr>
            <th>伝票番号</th>
            <th>取引区分</th>
            <th>団体名</th>
            <th>顧客名</th>
            <th>見積</th>
            <th>請求</th>
            <th>入金</th>
            <th>納品</th>
            <th>領収</th>
            <th>合計金額</th>
            <th>担当者</th>
            <th>最終更新日</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="progressListBody"></tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
