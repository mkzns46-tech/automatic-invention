<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARICO ARCHERY 顧客管理</title>
<link rel="stylesheet" href="sales-style.css?v=20260614-invoice-display-fix">
<script src="sales-auth.js"></script>
<script>requireSalesAuth();</script>
<script src="sales-nav.js?v=20260614-progress" defer></script>
<script src="staff-display.js?v=20260616-staff-display-map"></script>
<script src="sales-storage.js?v=20260617-number-quota-fix"></script>
<script src="customers-storage.js?v=20260614-customers-clean"></script>
<script src="customers.js?v=20260614-progress-sort" defer></script>
</head>
<body>
<main class="sales-wrap">
  <header class="sales-header">
    <div>
      <div class="brand">ARICO ARCHERY</div>
      <h1>顧客管理</h1>
      <p class="lead">販売管理用の顧客マスターを管理します。スマレジ会員データ取込は設定画面で行います。</p>
    </div>
    <div class="sales-actions">
      <a class="pill" href="index.html">販売管理トップ</a>
      <button type="button" class="secondary" onclick="logoutSales();">ログイン画面に戻る</button>
    </div>
  </header>

  <div id="salesMessage" class="message">顧客管理を確認できます。</div>

  <section class="card collapsible-list-card">
    <div class="sales-actions section-heading-row">
      <h2 class="list-heading" onclick="toggleCustomerList();">顧客一覧 <span class="status-badge muted" id="customerListCount">0件</span></h2>
      <button type="button" class="secondary list-toggle-button" id="customerListToggle" onclick="toggleCustomerList();">一覧を閉じる</button>
      <button type="button" class="primary" onclick="startNewCustomerRegistration();">＋新規顧客</button>
    </div>
    <div class="list-panel" id="customerListPanel">
      <div class="list-filter-row customer-filter-row">
        <label>一覧検索<input id="customerSearch" placeholder="顧客名・団体名・電話番号・メール・区分・担当者・スマレジ会員コード"></label>
        <label>顧客区分
          <select id="customerTypeFilter">
            <option value="">全て</option>
          </select>
        </label>
        <label>開始日<input id="customerDateFromFilter" type="date"></label>
        <label>終了日<input id="customerDateToFilter" type="date"></label>
      </div>
      <div class="table-wrap list-scroll">
        <table class="customer-list-table">
          <thead><tr><th>顧客コード</th><th>顧客名</th><th>団体名</th><th>顧客区分</th><th>更新日</th><th>操作</th></tr></thead>
          <tbody id="customerListBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="card hidden" id="customerDetailCard">
    <div class="section-title">
      <div>
        <h2>顧客詳細</h2>
        <p class="section-note">顧客情報と同期状態を確認できます。</p>
      </div>
      <button type="button" class="secondary" onclick="hideCustomerDetail();">閉じる</button>
    </div>
    <div id="customerDetailBody" class="customer-detail-grid"></div>
    <div class="customer-history-placeholder">
      <h3>履歴</h3>
      <div class="shipping-roadmap">
        <span class="badge muted">見積履歴：準備中</span>
        <span class="badge muted">請求履歴：準備中</span>
        <span class="badge muted">入金履歴：準備中</span>
        <span class="badge muted">納品履歴：準備中</span>
        <span class="badge muted">領収履歴：準備中</span>
      </div>
    </div>
  </section>

  <section class="card" id="customerEditCard">
    <div class="section-title">
      <div>
        <h2 id="customerFormTitle">顧客編集</h2>
        <p class="section-note">顧客区分、担当者、備考などを販売管理側で管理できます。</p>
      </div>
      <button type="button" class="secondary" onclick="clearCustomerForm();">新規入力をクリア</button>
    </div>
    <input id="customerId" type="hidden">
    <div class="row three">
      <label>顧客コード<input id="customerCode" readonly></label>
      <label>スマレジ会員ID<input id="smaregiMemberId" readonly></label>
      <label>スマレジ会員コード<input id="smaregiMemberCode" readonly></label>
    </div>
    <div class="row three">
      <label>顧客名 <span class="required-badge">必須</span><input id="customerName"></label>
      <label>団体名<input id="customerOrganizationName" list="customerOrganizationSuggestions"></label>
      <datalist id="customerOrganizationSuggestions"></datalist>
      <label>カナ<input id="customerKana"></label>
      <label>顧客区分<select id="customerType"></select></label>
    </div>
    <div class="row three">
      <label>担当者<input id="customerStaff"></label>
      <label>郵便番号<input id="customerPostalCode"></label>
      <label>電話番号<input id="customerPhone"></label>
    </div>
    <div class="row two">
      <label>住所<input id="customerAddress"></label>
      <label>メールアドレス<input id="customerEmail" type="email"></label>
    </div>
    <label>備考<textarea id="customerMemo"></textarea></label>
    <div class="sales-actions">
      <button type="button" id="customerSaveButton" onclick="saveCustomer();">保存</button>
      <button type="button" class="danger" id="deleteCustomerButton" onclick="deleteCurrentCustomer();" hidden>削除</button>
    </div>
  </section>
</main>

<div id="salesPopup" class="app-popup hidden" role="dialog" aria-modal="true">
  <div class="app-popup-card">
    <div id="salesPopupTitle" class="app-popup-title">通知</div>
    <div id="salesPopupBody" class="app-popup-body"></div>
    <div class="sales-actions">
      <button type="button" id="salesPopupCancel" class="secondary" style="display:none;">キャンセル</button>
      <button type="button" onclick="closeSalesPopup();">OK</button>
    </div>
  </div>
</div>
</body>
</html>
