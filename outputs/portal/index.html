<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARICO PORTAL</title>
<link rel="manifest" href="/manifest.json?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#2d6a4f">
<link rel="stylesheet" href="style.css">
<script src="auth.js"></script>
<script>
const ARICO_PORTAL_LOGIN_KEY = "arico_portal_login";

function setLang(lang){
  sessionStorage.setItem("arico_lang", lang);
  if(lang === "ko"){
    location.href = "index_ko.html";
  }
}

function login(){
  const id = document.getElementById("id").value.trim();
  const pass = document.getElementById("pass").value.trim();

  if(id === "arico" && pass === "0201"){
    createAuthSession(id);
    localStorage.removeItem(ARICO_PORTAL_LOGIN_KEY);
    sessionStorage.setItem(ARICO_PORTAL_LOGIN_KEY, "ok");
    location.href = "portal.html";
  }else{
    document.getElementById("error").innerText = "ユーザーIDまたはパスワードが違います。";
  }
}

window.onload = function(){
  localStorage.removeItem(ARICO_PORTAL_LOGIN_KEY);
  document.getElementById("id").focus();
};
</script>
</head>
<body>
<main class="wrap login-wrap">
  <section class="card login-card">
    <div class="topbar login-topbar">
      <div>
        <div class="brand">ARICO TOKYO</div>
        <h1>システム入口</h1>
        <p class="lead">業務システムに入るためのログイン画面です。</p>
      </div>
      <div class="top-actions">
        <a class="pill active" href="index.html">日本語</a>
        <a class="pill" href="index_ko.html">한국어</a>
      </div>
    </div>

    <label>ユーザーID
      <input id="id" autocomplete="username" placeholder="ユーザーID">
    </label>
    <label>パスワード
      <input id="pass" type="password" autocomplete="current-password" placeholder="パスワード" onkeydown="if(event.key==='Enter')login();">
    </label>
    <button type="button" onclick="login();">ログイン</button>
    <div id="error" class="error"></div>
  </section>
</main>
</body>
</html>
