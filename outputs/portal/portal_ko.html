function aricoLogout(){
  clearAuthSession();
  localStorage.removeItem(ARICO_PORTAL_LOGIN_KEY);
  sessionStorage.removeItem(ARICO_PORTAL_LOGIN_KEY);
  location.href = "index_ko.html";
}

function createPortalToken(){
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b => b.toString(16).padStart(2,"0")).join("");
}

function openInventory(){
  location.href = buildInventoryAuthUrl(ARICO_INVENTORY_URL);
}
