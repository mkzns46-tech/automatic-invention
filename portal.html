<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARICO PORTAL</title>
<link rel="stylesheet" href="style.css">
<script src="auth.js"></script>
<script>
const ARICO_PORTAL_LOGIN_KEY = "arico_portal_login";
const ARICO_PORTAL_HOME_URL = "https://automatic-invention-eight.vercel.app/portal/portal.html";

function buildPortalHomeUrl(){
  const params = new URLSearchParams();
  params.set("auth_token", localStorage.getItem("arico_auth_token") || "");
  params.set("auth_user", localStorage.getItem("arico_auth_user") || "");
  params.set("auth_expires", localStorage.getItem("arico_auth_expires") || "");
  return ARICO_PORTAL_HOME_URL + "?" + params.toString();
}

function setLang(lang){
  sessionStorage.setItem("arico_lang", lang);
  if(lang === "ko"){
    location.href = "index_ko.html";
  }
}

function login(){
  const id = document.getElementById("id").value.trim();
  const pass = document.getElementById("pass").value.trim();

  if(id === "arico" && pass === "0201"){
    createAuthSession(id);
    localStorage.removeItem(ARICO_PORTAL_LOGIN_KEY);
    sessionStorage.setItem(ARICO_PORTAL_LOGIN_KEY, "ok");
    location.href = buildPortalHomeUrl();
  }else{
    document.getElementById("error").innerText = "繝ｦ繝ｼ繧ｶ繝ｼID縺ｾ縺溘・繝代せ繝ｯ繝ｼ繝峨′驕輔＞縺ｾ縺吶・;
  }
}

window.onload = function(){
  localStorage.removeItem(ARICO_PORTAL_LOGIN_KEY);
  document.getElementById("id").focus();
};
</script>
</head>
<body>
<main class="wrap login-wrap">
  <section class="card login-card">
    <div class="topbar login-topbar">
      <div>
        <div class="brand">ARICO TOKYO</div>
        <h1>繧ｷ繧ｹ繝・Β蜈･蜿｣</h1>
        <p class="lead">讌ｭ蜍吶す繧ｹ繝・Β縺ｫ蜈･繧九◆繧√・繝ｭ繧ｰ繧､繝ｳ逕ｻ髱｢縺ｧ縺吶・/p>
      </div>
      <div class="top-actions">
        <a class="pill active" href="index.html">譌･譛ｬ隱・/a>
        <a class="pill" href="index_ko.html">﨑懋ｵｭ・ｴ</a>
        <a class="pill" href="https://automatic-invention-eight.vercel.app/backorder/backorder.html">取り寄せ管理</a>
      </div>
    </div>

    <label>繝ｦ繝ｼ繧ｶ繝ｼID
      <input id="id" autocomplete="username" placeholder="繝ｦ繝ｼ繧ｶ繝ｼID">
    </label>
    <label>繝代せ繝ｯ繝ｼ繝・      <input id="pass" type="password" autocomplete="current-password" placeholder="繝代せ繝ｯ繝ｼ繝・ onkeydown="if(event.key==='Enter')login();">
    </label>
    <button type="button" onclick="login();">繝ｭ繧ｰ繧､繝ｳ</button>
    <div id="error" class="error"></div>
  </section>
</main>
</body>
</html>
